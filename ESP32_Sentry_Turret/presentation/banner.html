<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Banner - The Ultimate Threat Detection System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

@page {
    size: 34in 10.5in;
    margin: 0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

body {
    width: 34in;
    height: 10.5in;
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
}

.banner {
    width: 34in;
    height: 10.5in;
    background: #0a0a0f;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Grid background */
.banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
        linear-gradient(rgba(255, 179, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 179, 0, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
}

/* Horizontal accent lines */
.line-top, .line-bottom {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent 2%, #FFB300 20%, #FFB300 80%, transparent 98%);
    opacity: 0.35;
    z-index: 1;
}
.line-top { top: 0.7in; }
.line-bottom { bottom: 0.7in; }

/* Thin secondary accent lines */
.line-top2, .line-bottom2 {
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, rgba(255,179,0,0.2) 25%, rgba(255,179,0,0.2) 75%, transparent 95%);
    z-index: 1;
}
.line-top2 { top: 0.85in; }
.line-bottom2 { bottom: 0.85in; }

/* All content above background */
.content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 3.5in;
}

/* Left and right target symbols */
.target-left, .target-right {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    opacity: 0.55;
}
.target-left  { left: 0.6in; }
.target-right { right: 0.6in; }

/* Subtitle line above title */
.pre-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28pt;
    color: #FFB300;
    letter-spacing: 14px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 0.12in;
}

/* Main title */
h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 145pt;
    text-align: center;
    line-height: 1.1;
    background: linear-gradient(135deg, #FFB300 0%, #FFE082 40%, #5BC8F5 60%, #FFB300 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.18in;
    letter-spacing: 4px;
}

/* Divider line between title and byline */
.divider {
    width: 8in;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FFB300, #5BC8F5, #FFB300, transparent);
    margin-bottom: 0.18in;
    opacity: 0.6;
}

/* Byline */
.byline {
    font-family: 'Rajdhani', sans-serif;
    font-size: 48pt;
    font-weight: 400;
    color: #aaa;
    letter-spacing: 6px;
    text-align: center;
}

.byline span {
    color: #5BC8F5;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="banner">

    <!-- Background accents -->
    <div class="line-top"></div>
    <div class="line-top2"></div>
    <div class="line-bottom"></div>
    <div class="line-bottom2"></div>

    <!-- Left target -->
    <svg class="target-left" width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="110" r="105" fill="none" stroke="#FFB300" stroke-width="2"/>
        <circle cx="110" cy="110" r="70"  fill="none" stroke="#FFB300" stroke-width="1.5"/>
        <circle cx="110" cy="110" r="35"  fill="none" stroke="#FFB300" stroke-width="1"/>
        <line x1="110" y1="0"   x2="110" y2="68"  stroke="#FFB300" stroke-width="2"/>
        <line x1="110" y1="152" x2="110" y2="220" stroke="#FFB300" stroke-width="2"/>
        <line x1="0"   y1="110" x2="68"  y2="110" stroke="#FFB300" stroke-width="2"/>
        <line x1="152" y1="110" x2="220" y2="110" stroke="#FFB300" stroke-width="2"/>
        <circle cx="110" cy="110" r="5" fill="#FFB300"/>
    </svg>

    <!-- Right target -->
    <svg class="target-right" width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="110" r="105" fill="none" stroke="#FFB300" stroke-width="2"/>
        <circle cx="110" cy="110" r="70"  fill="none" stroke="#FFB300" stroke-width="1.5"/>
        <circle cx="110" cy="110" r="35"  fill="none" stroke="#FFB300" stroke-width="1"/>
        <line x1="110" y1="0"   x2="110" y2="68"  stroke="#FFB300" stroke-width="2"/>
        <line x1="110" y1="152" x2="110" y2="220" stroke="#FFB300" stroke-width="2"/>
        <line x1="0"   y1="110" x2="68"  y2="110" stroke="#FFB300" stroke-width="2"/>
        <line x1="152" y1="110" x2="220" y2="110" stroke="#FFB300" stroke-width="2"/>
        <circle cx="110" cy="110" r="5" fill="#FFB300"/>
    </svg>

    <!-- Main content -->
    <div class="content">
        <div class="pre-title">// Science Fair 2026</div>
        <h1>THE ULTIMATE THREAT<br>DETECTION SYSTEM</h1>
        <div class="divider"></div>
        <div class="byline">An Autonomous Sentry Turret Powered by <span>ESP32</span></div>
    </div>

</div>
</body>
</html>
